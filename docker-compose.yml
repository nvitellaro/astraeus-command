version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: astraeus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: astraeus_user
      POSTGRES_PASSWORD: astraeus_pass
      POSTGRES_DB: astraeus_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: python:3.11-slim
    container_name: astraeus_backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "5001:5000"
    env_file:
      - .env
    command: sh -c "pip install fastapi uvicorn sqlalchemy psycopg2-binary python-dotenv requests pydantic && uvicorn app.main:app --host 0.0.0.0 --port 5000 --reload"
    depends_on:
      - postgres

  frontend:
    image: node:20-alpine
    container_name: astraeus_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5174:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - backend

volumes:
  postgres_data: